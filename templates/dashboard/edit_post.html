{% extends '../base/base.html' %}

{% block content %}

<div class="row">
    <!-- left sidebar -->
    {% include './leftsidebar.html' %}

    {% load crispy_forms_tags %}
    <!-- right sidebar -->
     
    <div class="col-md-9">

        <h3>Edit POst</h3>

        <form action="{% url 'edit_posts' post.id %}" method="POST" enctype="multipart/form-data" style="width: 500px;">
            {% csrf_token %}
            {{ form | crispy }}

            <button type="submit" class="btn btn-warning">Submmit</button>

        </form>
    </div>


</div>

{% endblock %}
